<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gameday">
<meta name="theme-color" content="#141a24">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Gameday</title>
<script>try{var t=localStorage.getItem("fa.theme");document.documentElement.dataset.theme=t==="light"||t==="dark"?t:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="theme.css?v=2">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<header class="dkh" id="hdr">
  <a class="brand" href="#" id="brand" aria-label="Home"><span class="nm" id="bname">Gameday</span><svg aria-hidden="true" viewBox="0 0 180 180"><rect width="180" height="180" rx="40" fill="var(--dk-surface-2)"/><ellipse cx="90" cy="90" rx="62" ry="38" transform="rotate(-35 90 90)" fill="var(--dk-accent)"/><path d="M66 114 114 66M80 92l8 8M88 84l8 8M96 76l8 8" stroke="var(--dk-ink)" stroke-width="8" stroke-linecap="round" fill="none"/></svg></a>
  <span class="sp"></span>
  <button type="button" class="rb" id="theme" aria-label="Switch theme" title="Switch light / dark"></button>
  <button type="button" class="rb" id="refresh" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <span class="br" aria-hidden="true"></span>
  <label class="lgp" id="lgp" title="Your league"><span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span><span class="ln" id="lgname">My league</span><span class="cv" aria-hidden="true">▾</span><select id="lg" aria-label="League"></select></label>
  <span class="sp"></span>
  <button type="button" class="featb" id="featb" aria-expanded="false" aria-controls="feat"><span aria-hidden="true">✦</span> Ask for a feature</button>
</header>
<div id="feat" role="dialog" aria-label="Ask for a feature" hidden>
  <h2>Ask for a feature</h2>
  <p>Say what this app should do. It goes to your advisor, who builds it into this app.</p>
  <textarea id="ftext" placeholder="e.g. Show my opponent's injuries before kickoff" aria-label="Feature idea"></textarea>
  <div class="acts"><a class="pbtn pri" id="fsend" href="#">Send by text</a><button type="button" class="pbtn" id="fcopy">Copy text</button><span class="sp"></span><button type="button" class="pbtn" id="fclose">Close</button></div>
  <div class="msg" id="fmsg" aria-live="polite"></div>
  <div class="reqs" id="freqs" hidden></div>
</div>
<nav class="dkn" id="nav" aria-label="Pages">
  <button type="button" class="dkn-t" data-p="team">Team</button>
  <button type="button" class="dkn-t" data-p="map">Map</button>
  <button type="button" class="dkn-t" data-p="research">Research</button>
  <a class="dkn-nl" id="textadv" href="#">Text advisor</a>
</nav>
<main id="main"><p class="empty">Loading…</p></main>
<script src="md.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
